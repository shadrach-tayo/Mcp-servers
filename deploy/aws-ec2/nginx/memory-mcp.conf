# /etc/nginx/sites-available/memory-mcp
# TLS certs via certbot --nginx -d memory-mcp.example.com

server {
    listen 80;
    server_name memory-mcp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name memory-mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/memory-mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memory-mcp.example.com/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8007/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
