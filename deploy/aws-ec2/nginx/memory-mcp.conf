# Install: sudo cp deploy/aws-ec2/nginx/memory-mcp.conf /etc/nginx/conf.d/memory-mcp.conf
# Edit server_name and ssl_certificate* paths, then: sudo nginx -t && sudo systemctl reload nginx
#
# Uvicorn (memory-mcp.service) listens on 127.0.0.1:8007 only.
# Proxy the whole app: /.well-known/* (OAuth metadata) lives at the Starlette root;
# MCP + /api/health live under MCP_MOUNT_PREFIX (default /api).

upstream memory_mcp {
    server 127.0.0.1:8007;
    keepalive 32;
}

# HTTP — Let's Encrypt HTTP-01 (optional) + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mcp.livemigrate.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.livemigrate.ai;

    # Let's Encrypt (certbot --nginx -d mcp.livemigrate.ai)
    ssl_certificate     /etc/letsencrypt/live/mcp.livemigrate.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.livemigrate.ai/privkey.pem;

    # Cloudflare Origin Certificate (alternative — comment out LE paths above):
    # ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    # ssl_certificate_key /etc/nginx/ssl/cloudflare-origin-key.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MEMORY_MCP_SSL:10m;

    # Proxy all paths to FastMCP (do not strip /api — app routing expects full URI)
    location / {
        proxy_pass http://memory_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # MCP Streamable HTTP / SSE (https://gofastmcp.com/deployment/http#reverse-proxy-nginx)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
