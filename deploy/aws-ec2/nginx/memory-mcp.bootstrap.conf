# Use this BEFORE TLS certs exist (nginx -t will fail if ssl_certificate paths are missing).
#
#   sudo cp deploy/aws-ec2/nginx/memory-mcp.bootstrap.conf /etc/nginx/conf.d/memory-mcp.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain certs (Let's Encrypt or Cloudflare Origin) and switch to memory-mcp.conf.
# Cloudflare: SSL mode "Full" or "Full (strict)" — clients still use HTTPS at the edge.

upstream memory_mcp {
    server 127.0.0.1:8007;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.livemigrate.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://memory_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
