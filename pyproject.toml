[project]
name = "mcp-starter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shadrach", email = "shadrachtemitayo@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "asyncio>=4.0.0",
    "fastmcp>=3.4.4",
    "psycopg2>=2.9.12",
    "py-key-value-aio[redis]>=0.4.5",
]

[project.scripts]
mcp-starter = "mcp_starter:main"
mcp-client = "mcp_starter.client:main"
postgres-mcp = "postgres_mcp:main"
postgres-client = "postgres_mcp.client:main"
memory-mcp = "memory_mcp.server:main"
memory-client = "memory_mcp.client:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
